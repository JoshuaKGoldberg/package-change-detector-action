jobs:
  build_release:
    name: Build (Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - run: pnpm build:release
      - run: |
          # Verify dist/ is up to date
          changes=$(git status --porcelain --untracked-files=all --ignored -- dist ':!*.d.ts' ':!*.d.ts.map')
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::dist/ is out of date. Run 'pnpm build:release', then commit the files listed above. Files marked !! are gitignored and need 'git add --force'."
            exit 1
          fi

  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - run: pnpm build
      - parallel:
          - name: Dedupe Check
            run: pnpm dedupe --check
          - name: Format Check
            run: pnpm format --list-different
          - name: Lint
            run: pnpm lint
          - name: Lint GitHub Actions
            uses: zizmorcore/zizmor-action@v0.6.4
            with:
              advanced-security: "false"
              annotations: "true"
          - name: Lint Knip
            run: pnpm lint:knip
          - name: Lint Knip Production
            run: pnpm lint:knip:production
          - name: Lint Spelling
            run: pnpm lint:spelling
          - name: Type Check
            run: pnpm tsc

  engines_check:
    name: Engines Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          cache: pnpm
          node-version: 22.12.0
      - run: pnpm install --prod --engine-strict --ignore-scripts

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - run: pnpm run test --coverage
      - env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: always()
        uses: codecov/codecov-action@v3

name: CI

on:
  pull_request: ~
  push:
    branches:
      - main

permissions:
  contents: read
